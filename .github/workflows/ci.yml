name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore ./src/MaintenanceManagement.Api/MaintenanceManagement.Api.csproj

      - name: Build API
        run: dotnet build ./src/MaintenanceManagement.Api/MaintenanceManagement.Api.csproj --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build API Docker image
        run: docker build -f ./src/MaintenanceManagement.Api/MaintenanceManagementDockerfile -t maintenance-api:ci ./src/MaintenanceManagement.Api

      - name: Build frontend Docker image
        run: docker build -f ./frontend/FrontendDockerfile -t maintenance-frontend:ci ./frontend


      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'maintenance-api:ci'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'maintenance-frontend:ci'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'